name: Auto-Sync Portfolio & Resume

on:
  push:
    paths:
      - 'data.json'
      - 'sync.py'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Synchronizer
        run: |
          python sync.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html resume.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync portfolio and resume from data.json [skip ci]" && git push)

      - name: Notify Telegram on Deployment Complete
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST https://dineshk-portfolio.vercel.app/api/webhook \
            -H "Content-Type: application/json" \
            -d "{\"event\": \"deployment_completed\", \"status\": \"$STATUS\"}"
